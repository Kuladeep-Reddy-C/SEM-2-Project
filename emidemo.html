<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI CALCULATOR</title>
    <link rel="icon" type="image/x-icon" href="Ai/icon.jpg">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.6.2/dist/chart.min.js"></script>

    <Style>
        body{
            background-color: rgb(77, 170, 223);
        }

        .main{
            margin: 100px auto;
            padding: 0px;
            /* border: 2px solid #ccc; */
            /* border-radius: 10px; */
            display: flex;
            flex-direction: column;
            /* text-align: center; */
            justify-content: center;
            align-items: center;
            max-width: 500px;
            /* height: 600px; */
        }

        .m1{
            background-color: rgb(9, 19, 66);
            width: 100%;
            text-align: left;
            /* border-radius: 10px; */
            border-top-left-radius: 10px; 
            border-top-right-radius: 10px;
            color: white;
            padding: 30px;
        }

        .m11{
            display: flex;
            flex-direction: row;
            /* justify-content: space-between; */
            margin: 10px auto;
        }

        .item2 {
            margin-left: 130px;
            margin-right: 99px;
        }

        .m12 {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        .m12 input[type="number"]{
            width: 130px;
            height: 25px;
            border: none;
            border-radius: 5px;
        }

        .m2{
            background-color: #fff;
            width: 100%;
            text-align: left;
            /* border-radius: 10px; */
            border-bottom-left-radius: 10px; 
            border-bottom-right-radius: 10px;
            color: rgb(7, 7, 7);
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .m21,.m22{
            width: 50%;
        }

        hr{
            width: 80%;
            margin-left: 0px;
        }

        #but{
            padding: 10px 35px;
            margin-top: 10px;
            background-color: red;
            border-radius: 5px;
            border: 1px solid red;
            font-size: large;
            color: #fff;
            margin-left: 178px;
            text-align: center;
            margin-top: 30px;
            cursor: pointer;
            margin-bottom: -10px;
        }
        
        #but:hover{
            background: rgb(9, 19, 66);
            /* box-shadow: 0 0 30px rgb(9, 19, 66); */
        }

        #o1::before,#o2::before,#o3::before{
            content:"₹";
            font-weight: 400;
            margin-right: 6px;
            font-size: 22px;
            opacity: 0.4;
        }

    </style>

</head>
<body>
    <div class="main">
        <div class="m1">
            <p style="font-size:larger; font-weight: bold; margin-bottom: 13px; margin-top: 0px;">EMI Calculator</p>

            <form id="emi-form">
                <div class="m11">
                    <div class="item">
                        <label for="amount">Amount</lable>
                    </div>
                    <div class="item2">
                        <label for="int">Interest Rate</lable>
                    </div>
                    <div class="item3">
                        <label for="tenure">Tenure (in months)</lable>
                    </div>
                </div>

                <div class="m12">
                    <input type="number" id="amount" class="c1" placeholder="₹ 0"> 
                    <input type="number" id="int" class="c2" placeholder="0">
                    <input type="number" id="tenure" class="c3" placeholder="0">
                </div>
<!-- 
                <input type="submit" id="but" value="Calculate"> -->
                <button type="button" id="but" class="but">Calculate</button>
            </form>

        </div>

        <div class="m2">

            <div class="m21">

                <p style="margin-top: 0px; margin-bottom: 9px;">Loan EMI</p>
                <p id="o1" style="font-weight: bold; font-size: x-large; margin-top: 0px; margin-bottom: 9px;">0</p>
                <hr>

                <p style="margin-top: 0px; margin-bottom: 9px;">Total Interest Payable</p>
                <p id="o2" style="font-weight: bold; font-size: x-large; margin-top: 0px; margin-bottom: 9px;">0</p>
                <hr>

                <p style="margin-top: 0px;  margin-bottom: 9px">Total Payable</p>
                <p id="o3" style="font-weight: bold; font-size: x-large; margin-top: 0px; margin-bottom: 0px;">0</p>
                <hr>

            </div>

            <div class="m22">

                <canvas id="myPieChart" width="100px" height="100px"></canvas>

            </div>
            
        </div>
    </div>

    <script>
        
        const button=document.querySelector(".but");
        button.addEventListener('click',calculate);

        function calculate(){

            const lap=document.querySelector(".m12 .c1");
            const ir=document.querySelector(".m12 .c2");
            const lt=document.querySelector(".m12 .c3");

            var loanAmount = parseFloat(lap.value);
            var interestRate = parseFloat(ir.value) / 100 / 12;
            var loanTenure = parseInt(lt.value);
            if(interestRate==0){
                var emi = loanAmount/loanTenure
            }
            else{
                var emi = (loanAmount * interestRate * Math.pow(1 + interestRate, loanTenure)) / (Math.pow(1 + interestRate, loanTenure) - 1);
            }
            var totalPayment = emi * loanTenure;
            var intPayable = totalPayment-loanAmount;
            
            document.getElementById("o1").innerHTML=Math.round(emi);
            document.getElementById("o3").innerHTML=Math.round(totalPayment);
            document.getElementById("o2").innerHTML=Math.round(intPayable);

            function pie(a1,a2){
                var data = {
                labels: ['Pricipal', 'Interest Payable'],
                datasets: [{
                    data: [a1,a2], 
                    backgroundColor: [
                        'rgb(9, 19, 66)',
                        'red'
                    ],
                }]
                };

                // var ctx = document.getElementById('Chart').getContext('2d');
                let canvas = document.getElementById('myPieChart');
                let ctx = canvas.getContext('2d');

                // if(window.Chart != undefined){
                //     ctx.clearRect(0, 0,
                //     canvas.width, canvas.height);
                // }

                // if(window.myPieChart != undefined){
                //     window.myPieChart.destroy();
                // }
        
                var myPieChart = new Chart(ctx, {
                    type: 'pie',
                    data: data,
                });

            }

            pie(loanAmount, Math.round(intPayable));

            // function upchart(b1,b2){
            //     // myPieChart.data.datasets[0].data[0]=b1;
            //     // myPieChart.data.datasets[0].data[1]= Math.round(b2);
            //     myPieChart.update();
            // }

            // if(myPieChart){
            //     upchart(loanAmount,intPayable);
            // }else{
            //     pie(loanAmount, Math.round(intPayable));
            // }

        }

    </script>
</body>
</html>
